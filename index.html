<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceef8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FlowSpace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧘‍♀️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef8;--surface:#ffffff;--surface2:#e2e5f3;--text:#1c1d33;--muted:#5b5e7a;--border:#d3d6e8;
  --primary:#4c4fb3;--on-primary:#fff;--primary-ink:#4c4fb3;--accent:#4cc9a6;--on-accent:#0f2a22;--accent-ink:#1d7a61;
  --soft:#e3e4f7;--glow:rgba(76,79,179,.45);
  --display:'Bricolage Grotesque',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;transition:background-color .45s ease,color .45s ease;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.65rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--primary-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.03em;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 200deg,var(--primary),var(--accent),var(--primary));display:grid;place-items:center;color:var(--on-primary);font-size:1rem;animation:spin 18s linear infinite}
.brand-mark span{animation:spin 18s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;gap:.3rem;margin-left:1rem}
.nav button{border:0;background:transparent;padding:.55rem .95rem;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);transition:background .2s,color .2s,transform .2s}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:var(--primary);color:var(--on-primary)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.hello{font-size:.9rem;color:var(--muted);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.hello b{color:var(--text)}
.icon-btn{border:1px solid var(--border);background:var(--surface);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:1.05rem;transition:transform .2s}
.icon-btn:hover{transform:translateY(-2px)}

/* ---------- main ---------- */
main{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem}
.view{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:1rem;margin-bottom:1.1rem}
.head h2{flex:1 1 auto}
.subtabs{display:inline-flex;background:var(--surface2);padding:4px;border-radius:999px;gap:2px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:.5rem 1rem;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s}
.subtabs button.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:1.2rem}
.view .card,.view .empty{animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.view .card:nth-child(2){animation-delay:.04s}.view .card:nth-child(3){animation-delay:.08s}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.card+.card,.stack>*+*,.grid2+.card,.grid3+.card,.card+.grid2,.card+.grid3{margin-top:1rem}
.grid2>*,.grid3>*{margin-top:0!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.mt{margin-top:.8rem}.mt2{margin-top:1.3rem}
.empty{border:2px dashed var(--border);border-radius:22px;padding:2rem 1.2rem;text-align:center;color:var(--muted)}
.empty .big{font-size:2.2rem;display:block;margin-bottom:.4rem}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--border);background:var(--surface);padding:.6rem 1.05rem;border-radius:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;transition:transform .18s,box-shadow .18s,background .2s;text-decoration:none;color:var(--text);white-space:normal;text-align:left}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px var(--glow)}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:#c0392b;border-color:color-mix(in srgb,#c0392b 40%,var(--border))}
.btn.sm{padding:.4rem .75rem;font-size:.875rem;border-radius:11px}
.btn.lg{padding:.9rem 1.4rem;font-size:1.05rem;border-radius:16px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- forms ---------- */
label.f{display:block;font-weight:600;font-size:.9rem;margin:.75rem 0 .3rem}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--border);background:var(--bg);border-radius:12px;padding:.65rem .8rem;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent)}
textarea.in{resize:none;min-height:3.2rem;overflow:hidden;line-height:1.55}
.in::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);padding:.5rem .85rem;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.check{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.pw{position:relative}
.pw .in{padding-right:4.5rem}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--surface2);border-radius:9px;padding:.3rem .6rem;font-size:.8rem;font-weight:700;cursor:pointer}
.ac-wrap{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);overflow:hidden;max-height:260px;overflow-y:auto}
.ac button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:.6rem .85rem;cursor:pointer;gap:.6rem;align-items:center}
.ac button:hover,.ac button:focus{background:var(--soft)}
.ac img{width:30px;height:30px;border-radius:8px;object-fit:cover}

/* ---------- hover delete ---------- */
.hx{position:relative}
.x{border:0;background:#e5484d;color:#fff;width:22px;height:22px;border-radius:50%;font-size:.7rem;font-weight:800;cursor:pointer;display:none;place-items:center;flex:none;line-height:1}
.hx:hover>.x,.hx:hover>.xr>.x,.hx.tapx>.x,.hx.tapx>.xr>.x{display:grid;animation:fade .15s}
.chip>.x{position:absolute;top:-7px;right:-7px}
.qa.hx:hover h4>.x,.qa.hx.tapx h4>.x{display:grid}


/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1.5px solid var(--border);background:var(--bg);border-radius:999px;padding:.4rem .85rem;cursor:pointer;font-weight:600;font-size:.92rem;display:inline-flex;gap:.35rem;align-items:center;transition:all .18s}
.chip:hover{transform:translateY(-1px)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.acc.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.add{border-style:dashed;background:transparent;color:var(--primary-ink)}

/* ---------- session pills ---------- */
.pills{display:flex;flex-wrap:wrap;gap:.5rem;align-items:stretch}
.pill{border:1.5px solid var(--border);background:var(--surface);border-radius:16px;padding:.55rem 1rem;cursor:pointer;font-weight:700;text-align:left;max-width:100%;white-space:normal;word-break:break-word;height:auto;transition:all .2s}
.pill.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill.dragover{outline:2px dashed var(--accent)}

/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:14px;background:var(--bg);border:1px solid var(--border)}
.li+.li{margin-top:.45rem}
.li.done .lt{text-decoration:line-through;color:var(--muted)}
.li .lt{flex:1;min-width:0;word-break:break-word}
.li.drag{opacity:.4}.li.dragover{outline:2px dashed var(--accent)}
.li.cur{border-color:var(--primary);box-shadow:inset 4px 0 0 var(--primary)}
.handle{cursor:grab;color:var(--muted);user-select:none;padding:0 .15rem}
.arrows{display:flex;gap:2px}
.arrows button{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:.8rem}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:var(--soft);color:var(--primary-ink)}
.tag.acc{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--accent-ink)}
.addline{display:flex;gap:.5rem;margin-top:.6rem}
.addline .in{flex:1}

/* ---------- timer ---------- */
.timer-wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:2rem;align-items:center}
.ring-box{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto}
.ring-box::before{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:0 0 0 0 var(--glow);opacity:0;transition:opacity .4s}
.ring-box.live::before{opacity:1;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 18px 4px var(--glow)}50%{box-shadow:0 0 60px 22px var(--glow)}}
.ring-box svg{width:100%;height:100%;transform:rotate(-90deg);position:relative}
.ring-track{fill:none;stroke:var(--surface2);stroke-width:14}
.ring-bar{fill:none;stroke:url(#rg);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring-mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-time{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,9vw,4.2rem);letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.ring-phase{font-weight:700;color:var(--muted);font-size:.9rem;margin-top:.3rem}
.t-info{min-width:0}
.t-info h3{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800;word-break:break-word}
.t-desc{color:var(--muted);margin-top:.5rem;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.t-img{margin-top:1rem;border-radius:20px;max-height:260px;width:100%;object-fit:cover}
.ctrls{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.skips{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.skips button{padding:.8rem 0;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);font-weight:800;font-size:1rem;cursor:pointer;transition:transform .15s}
.skips button:hover{transform:translateY(-2px)}
.skips button.plus{background:color-mix(in srgb,var(--accent) 20%,var(--bg));border-color:var(--accent)}
.drawer{overflow:hidden;animation:slide .3s ease}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
input[type=range]{width:100%;accent-color:var(--primary)}

/* ---------- image picker ---------- */
.imgpick{display:flex;gap:.7rem;align-items:flex-start;flex-wrap:wrap}
.imgpick .prev{width:84px;height:84px;border-radius:16px;object-fit:cover;border:1px solid var(--border)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- planner ---------- */
.datehead{border:0;background:transparent;cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.65rem;color:var(--text);padding:0;text-align:left;display:inline-flex;align-items:center;gap:.5rem}
.datehead .cal-ico{font-size:1rem;background:var(--surface2);border-radius:10px;padding:.3rem .5rem}
.datehead:hover .cal-ico{background:var(--primary);color:var(--on-primary)}
.weeknav{display:flex;gap:.4rem;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:transparent;width:38px;height:38px;cursor:pointer;font-size:1.1rem;font-weight:800}
.stepper button:hover{background:var(--soft)}
.stepper input{width:56px;border:0;background:transparent;text-align:center;font-weight:700;padding:0}
.stepper .val{min-width:64px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .4s}
.goal.complete{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.day-card h3{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.day-card.today{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.meal{cursor:pointer;display:flex;gap:.7rem;align-items:center;padding:.75rem;border-radius:16px;background:var(--bg);border:1px solid var(--border);transition:transform .18s}
.meal:hover{transform:translateX(3px)}
.meal+.meal{margin-top:.5rem}
.meal .mi{font-size:1.5rem}
.meal.done{opacity:.6}
.steps-ol{counter-reset:s;list-style:none;padding:0;margin:0}
.steps-ol .li{counter-increment:s}
.steps-ol .li::before{content:counter(s);font-family:var(--display);font-weight:800;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--primary-ink);display:grid;place-items:center;flex:none}

/* ---------- diary ---------- */
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;max-height:220px;overflow-y:auto;padding:4px;border:1px solid var(--border);border-radius:14px;background:var(--bg)}
.emoji-grid button{border:0;background:transparent;font-size:1.45rem;padding:.3rem 0;border-radius:10px;cursor:pointer}
.emoji-grid button:hover{background:var(--soft)}
.emoji-grid button.on{background:var(--primary);box-shadow:0 0 0 2px var(--accent)}
.panel{background:var(--bg);border:1.5px solid var(--border);border-radius:18px;padding:1rem;margin-top:.8rem;animation:slide .3s ease}
.qa{border-left:4px solid var(--accent);padding:.2rem 0 .2rem 1rem}
.qa+.qa{margin-top:1rem}
.qa h4{font-family:var(--body);font-weight:700;font-size:1rem;display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between}
.proud-box{font-size:1.1rem}
.won{display:inline-flex;gap:.4rem;align-items:center;background:color-mix(in srgb,var(--accent) 25%,var(--surface));color:var(--accent-ink);font-weight:800;padding:.35rem .8rem;border-radius:999px}

/* ---------- calendar ---------- */
.cal{user-select:none}
.cal-top{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}
.cal-top select{width:auto;flex:1 1 110px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding:.2rem 0}
.cal-d{aspect-ratio:1;border:0;border-radius:12px;background:var(--bg);cursor:pointer;font-weight:600;position:relative;display:grid;place-items:center;font-variant-numeric:tabular-nums;min-height:38px}
.cal-d:hover{background:var(--soft)}
.cal-d.out{opacity:.35}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-d.sel{background:var(--primary);color:var(--on-primary)}
.cal-d.inweek{background:color-mix(in srgb,var(--primary) 18%,var(--bg))}
.cal-d .dot{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,10,25,.45);display:grid;place-items:center;padding:1rem;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:26px;padding:1.3rem;width:min(460px,100%);max-height:calc(100dvh - 2rem);overflow-y:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(720px,100%)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.sw{border:2px solid var(--border);border-radius:16px;padding:.55rem;cursor:pointer;text-align:left;background:var(--bg);transition:transform .18s}
.sw:hover{transform:translateY(-2px)}
.sw.on{border-color:var(--primary)}
.sw .dots{display:flex;margin-bottom:.4rem}
.sw .dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-right:-6px}
.sw b{font-size:.85rem;display:block}
.colorrow{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.colorrow label{display:flex;flex-direction:column;gap:.3rem;font-weight:600;font-size:.85rem}
.colorrow input[type=color]{width:100%;height:46px;border:1.5px solid var(--border);border-radius:12px;padding:3px;background:var(--bg);cursor:pointer}

/* ---------- auth ---------- */
.auth{max-width:440px;margin:1rem auto}
.auth .card{padding:1.6rem}
.err{color:#c0392b;font-weight:600;font-size:.9rem;margin-top:.7rem}
.ok{color:var(--accent-ink);font-weight:600;font-size:.9rem;margin-top:.7rem}

/* ---------- toast & confetti ---------- */
#toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--text);color:var(--bg);padding:.7rem 1.1rem;border-radius:14px;font-weight:600;z-index:80;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center;opacity:0;visibility:hidden}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

/* ---------- bottom nav (mobile) ---------- */
.bnav{display:none}
body.m .nav{display:none}
body.m .hello{max-width:130px;font-size:.85rem}
body.m main{padding:1rem .9rem calc(6rem + env(safe-area-inset-bottom,0px))}
body.m .top-in{padding:.6rem .9rem}
body.m .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:.35rem .3rem calc(.35rem + env(safe-area-inset-bottom,0px))}
body.m .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.35rem 0;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;border-radius:14px;min-height:52px}
body.m .bnav button span{font-size:1.4rem;line-height:1;transition:transform .25s}
body.m .bnav button.on{color:var(--primary-ink)}
body.m .bnav button.on span{transform:translateY(-2px) scale(1.12)}
body.m #toast{bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
body.m .timer-wrap{grid-template-columns:1fr;gap:1.2rem}

/* similar-word matching: substring, shared stem, or small typo distance */

function similar(q,text){
  q=norm(q);text=norm(text);if(!q)return true;if(text.includes(q))return true;
  const qw=q.split(' '),tw=text.split(/[\s\-_/,]+/);

const ekey=e=>norm(e).replace(/[.#$\[\]\/%]/g,c=>'%'+c.charCodeAt(0).toString(16));
async function fb(path,method='GET',body){

  if(!r.ok)throw new Error(r.status===401||r.status===403?'The cloud database refused access. Check its security rules.':'Cloud error '+r.status);

}
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

}

/* ---------- color + theme ---------- */
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];};
const rgb2hex=a=>'#'+a.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t));};

  {id:'breath',name:'Morning Breath',p:'#4c4fb3',a:'#4cc9a6',b:'#eceef8'},
  {id:'moon',name:'Moonlit Mat',p:'#a7a9ff',a:'#6fe3c1',b:'#121428'},
  {id:'matcha',name:'Matcha Stretch',p:'#4f7d32',a:'#e8c547',b:'#eef4e4'},
  {id:'lilac',name:'Lilac Hour',p:'#7b4fb0',a:'#f28fad',b:'#f5effb'},
  {id:'tide',name:'Tidepool',p:'#14648f',a:'#3fd0c9',b:'#e6f3f8'},
  {id:'sunsal',name:'Sun Salutation',p:'#c0392b',a:'#f6b93b',b:'#fff3e6'},

function currentTheme(){return(D.theme&&D.theme.p)?D.theme:defaultTheme();}
function applyTheme(t){
  t=t||currentTheme();const r=document.documentElement.style;

  const head=new ArrayBuffer(44),v=new DataView(head);const w=(o,s)=>[...s].forEach((c,j)=>v.setUint8(o+j,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+pcm.byteLength,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm.byteLength,true);

}
const tickCache={};
function synthTick(final){

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],confRAF=0;
function confetti(n=90,emojis,goal){
  if(!goal)return; // celebrate only when a goal is reached
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('🎉');return;}
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;

  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.3,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-6,r:Math.random()*6+4,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,e:emojis&&Math.random()<.35?emojis[i%emojis.length]:null,life:0});
  if(!confRAF)confRAF=requestAnimationFrame(confTick);
}
function confTick(){
  const dpr=devicePixelRatio;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
    if(p.e){cx.font=(p.r*3.4)+'px serif';cx.fillText(p.e,0,0);}else{cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);}cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);
  if(parts.length)confRAF=requestAnimationFrame(confTick);else{confRAF=0;cx.clearRect(0,0,innerWidth,innerHeight);}
}

  <div class="card"><button class="btn" data-a="toggle" data-k="settings" aria-expanded="${!!ui.open.settings}">⚙️ Stretch Settings ${ui.open.settings?'▴':'▾'}</button>
  ${ui.open.settings?`<div class="drawer grid2 mt">
    <div><label class="f" for="ring">Completion ringtone</label><div class="row"><select class="in" id="ring" data-ch="ring" style="flex:1">${RINGS.map((r,i)=>`<option value="${i}" ${+R.ringtone===i?'selected':''}>${i+1}. ${r[0]}</option>`).join('')}</select><button class="btn" data-a="hear">▶ Hear Ringtone</button></div>
      <label class="f" for="vol">Volume <span class="muted" id="volv">${Math.round(R.volume*100)}%</span></label><input type="range" id="vol" min="0" max="1" step=".05" value="${R.volume}" data-in="vol">
      <p class="small muted mt">Plays through your phone’s media channel, so you’ll hear it even with the silent switch on. Media volume still applies.</p></div>
    <div><label class="f">When the timer reaches zero</label><div class="seg"><button class="${R.autoNext?'on':''}" data-a="autoNext" data-v="1">Auto jump to next stretch</button><button class="${!R.autoNext?'on':''}" data-a="autoNext" data-v="0">Manually move to next</button></div>
      <label class="f" for="prep">Prep time before each stretch (0–600 seconds)</label><input class="in" type="number" min="0" max="600" id="prep" data-in="prep" value="${R.prep===''?'':R.prep}" placeholder="Seconds">
      <label class="f" for="tick">Countdown ticks before each stretch ends (seconds, 0 = off)</label><div class="row"><input class="in" type="number" min="0" max="60" id="tick" data-in="tick" value="${R.tick===''?'':R.tick}" placeholder="3" style="flex:1"><button class="btn" data-a="hearTick">▶ Hear tick</button></div>
      <p class="small muted mt">A soft tick each second for the last N seconds, with a higher one on the final second.</p></div>
  </div>`:''}</div>`;
}
function stRow(st,i,timer){
  return`<div class="li hx ${timer&&i===T.idx?'cur':''}" draggable="true" data-drag="st" data-i="${i}" ${timer?`data-ti="${i}"`:''}>
    <span class="handle" aria-hidden="true">⠿</span>${st.img?`<img class="thumb" src="${esc(st.img)}" alt="" onerror="this.remove()">`:''}
    <span class="lt" ${timer?`data-a="tJump" data-i="${i}" style="cursor:pointer"`:''}><b>${esc(st.name)}</b><br><span class="small muted">${fmtTime(dur(st))}${st.bilateral?' × 2 sides':''}${st.bodyPart?' · '+esc(st.bodyPart):''}</span></span>
    <span class="arrows"><button data-a="stMove" data-i="${i}" data-d="-1" aria-label="Move up">↑</button><button data-a="stMove" data-i="${i}" data-d="1" aria-label="Move down">↓</button></span>
    ${!timer?`<button class="btn sm ghost" data-a="stEdit" data-i="${i}">✏️</button>`:''}${xBtn('stDel',`data-i="${i}"`)}</div>`;
}

/* ----- stretch form (shared) ----- */
function sForm(fid,o={}){
  const f=ui.form[fid]||(ui.form[fid]={bil:false,side:'L'});const img=ui.img[fid]||'';
  return`<div class="sform" data-fid="${fid}">
  <label class="f" for="${fid}-name">Stretch name</label>
  <div class="ac-wrap"><input class="in" id="${fid}-name" data-keep data-ac="${fid}" data-acmode="fill" autocomplete="off" placeholder="Type to search your library or name a new stretch"><div class="ac" id="${fid}-ac" hidden></div></div>
  <label class="f" for="${fid}-desc">Description</label><textarea class="in" id="${fid}-desc" data-keep data-grow rows="2" placeholder="Cues, breathing, how it should feel"></textarea>
  <div class="grid2"><div><label class="f" for="${fid}-dur">Duration (seconds)</label><input class="in" type="number" min="1" max="3600" id="${fid}-dur" data-keep placeholder="Seconds"></div>
  <div><label class="f" for="${fid}-bp">Target body area</label><div class="row"><select class="in" id="${fid}-bp" data-keep style="flex:1 1 140px"><option value="">None</option>${D.bodyParts.map(b=>`<option>${esc(b)}</option>`).join('')}</select><button class="btn sm" data-a="toggle" data-k="bp-${fid}">+ Body Part</button></div>
    ${ui.open['bp-'+fid]?`<div class="addline"><input class="in" id="${fid}-bpnew" placeholder="New body part" data-enter="bpAdd" data-f="${fid}"><button class="btn sm pri" data-a="bpAdd" data-f="${fid}">Add</button></div>`:''}
    ${D.bodyParts.length?`<div class="chips mt">${D.bodyParts.map(b=>`<span class="chip hx">${esc(b)}${xBtn('bpDel',`data-v="${esc(b)}"`)}</span>`).join('')}</div>`:''}</div></div>
  <label class="f">Sides</label><div class="seg"><button class="${!f.bil?'on':''}" data-a="fset" data-f="${fid}" data-k="bil" data-v="0">Single (1×)</button><button class="${f.bil?'on':''}" data-a="fset" data-f="${fid}" data-k="bil" data-v="1">Bilateral (2× · Left & Right)</button></div>
  ${f.bil?`<label class="f">Start with</label><div class="seg"><button class="${f.side==='L'?'on':''}" data-a="fset" data-f="${fid}" data-k="side" data-v="L">Left → Right</button><button class="${f.side==='R'?'on':''}" data-a="fset" data-f="${fid}" data-k="side" data-v="R">Right → Left</button></div>`:''}
  <label class="f">Picture</label><div class="imgpick">${img?`<img class="prev" src="${esc(img)}" alt="Stretch picture" onerror="this.style.opacity=.3">`:''}
    <div class="stack" style="flex:1;min-width:200px"><div class="row"><label class="btn sm file-btn">📷 Upload picture<input type="file" accept="image/*" data-file="${fid}"></label>${img?`<button class="btn sm ghost danger" data-a="imgRemove" data-f="${fid}">Remove picture</button>`:''}</div>
    <input class="in" id="${fid}-url" placeholder="…or paste an image link" data-ch="imgUrl" data-f="${fid}" value="${img&&!img.startsWith('data:')?esc(img):''}"></div></div>
  ${o.lib?`<label class="check mt"><input type="checkbox" id="${fid}-lib" data-keep checked> Save a copy to my Personal Library</label>`:''}
  <div class="row mt"><button class="btn pri" data-a="${o.submit}" data-f="${fid}" ${o.extra||''}>${o.label||'Add Stretch'}</button>${o.cancel?`<button class="btn ghost" data-a="${o.cancel}">Cancel</button>`:''}</div></div>`;
}
function loadForm(fid,st){ui.vals[fid+'-name']=st.name||'';ui.vals[fid+'-desc']=st.desc||'';ui.vals[fid+'-dur']=st.duration?String(st.duration):'';ui.vals[fid+'-bp']=st.bodyPart||'';ui.form[fid]={bil:!!st.bilateral,side:st.startSide||'L'};ui.img[fid]=st.img||'';}
function readForm(fid){
  const g=id=>{const el=document.getElementById(fid+'-'+id);return el?el.value:'';};
  const name=g('name').trim();if(!name){toast('Give the stretch a name first.');$('#'+fid+'-name')?.focus();return null;}
  const f=ui.form[fid]||{};const lib=document.getElementById(fid+'-lib');
  return{st:{id:uid(),name,desc:g('desc').trim(),duration:clamp(+g('dur')||30,1,3600),bodyPart:g('bp'),bilateral:!!f.bil,startSide:f.side||'L',img:ui.img[fid]||''},toLib:lib?lib.checked:false};
}
function resetForm(fid){clearVals(fid+'-');delete ui.form[fid];delete ui.img[fid];}
function dupIn(list,name,ignoreId){return list.some(x=>norm(x.name)===norm(name)&&x.id!==ignoreId);}
function addToLibrary(st,quiet){if(dupIn(D.library,st.name)){if(!quiet)toast(`“${st.name}” is already in your library.`);return false;}D.library.push({...st,id:uid()});return true;}
function addToList(list,st,label){if(dupIn(list,st.name)){toast(`“${st.name}” is already in ${label}.`);return false;}list.push({...st,id:uid(),libId:st.libId||null});return true;}

/* ----- routine ----- */
function vRoutine(){
  const s=session();if(!s)return'';
  const ed=ui.editing&&ui.editing.where==='sess'?ui.editing.i:-1;
  return`<div class="grid2 mt"><div class="card"><h3>${esc(s.name)}</h3><p class="small muted">Drag, or use the arrows, to reorder.</p>
    <div class="mt" data-dropzone="st">${s.stretches.length?s.stretches.map((st,i)=>i===ed?`<div class="panel">${sForm('ef',{submit:'stSave',label:'Save changes',cancel:'editCancel',extra:`data-i="${i}"`})}</div>`:stRow(st,i,false)).join(''):empty('🌿','No stretches in this session yet','Create one on the right, or pull one from your library.')}</div></div>
  <div class="stack"><div class="card"><h3>Add a new stretch</h3>${sForm('rf',{lib:true,submit:'addToSession'})}</div>
    ${D.library.length?`<div class="card"><h3>Add from your library</h3>${libPicker('rl','sess')}</div>`:''}</div></div>`;
}
function libPicker(id,target){
  const q=ui.search[id]||'';const tname=target==='sess'?(session()?.name||'session'):(ui.draft.name.trim()||'New Session');
  const list=target==='sess'?session().stretches:ui.draft.stretches;
  const items=D.library.filter(l=>similar(q,l.name+' '+(l.bodyPart||'')+' '+(l.desc||'')));
  return`<div class="ac-wrap mt"><input class="in" id="${id}" data-in="search" data-k="${id}" data-ac="${id}" data-acmode="add-${target}" value="${esc(q)}" placeholder="Search your library" autocomplete="off"><div class="ac" id="${id}-ac" hidden></div></div>
  <div class="mt">${items.length?items.map(l=>{const has=dupIn(list,l.name);return`<div class="li">${l.img?`<img class="thumb" src="${esc(l.img)}" alt="" onerror="this.remove()">`:''}<span class="lt"><b>${esc(l.name)}</b><br><span class="small muted">${fmtTime(dur(l))}${l.bilateral?' × 2':''}${l.bodyPart?' · '+esc(l.bodyPart):''}</span></span>
    <button class="btn sm ${has?'':'acc'}" data-a="libAdd" data-id="${l.id}" data-t="${target}" ${has?'disabled':''}>${has?'✓ Added':'+ Add to '+esc(tname)}</button></div>`;}).join(''):`<p class="small muted">No stretches match “${esc(q)}”.</p>`}</div>`;
}

/* ----- library ----- */
function vLibrary(){
  const q=ui.search.lib||'';const items=D.library.filter(l=>similar(q,l.name+' '+(l.bodyPart||'')+' '+(l.desc||'')));
  const ed=ui.editing&&ui.editing.where==='lib'?ui.editing.id:null;
  return`<div class="card"><div class="row"><div class="ac-wrap" style="flex:1 1 240px"><input class="in" id="libq" data-in="search" data-k="lib" data-ac="libq" data-acmode="lib" value="${esc(q)}" placeholder="Search stretches, body parts, cues" autocomplete="off"><div class="ac" id="libq-ac" hidden></div></div>
    <button class="btn pri" data-a="toggle" data-k="libnew">${ui.open.libnew?'Close':'+ New Stretch'}</button></div>
    ${ui.open.libnew?`<div class="panel">${sForm('lf',{submit:'libCreate',label:'Save to Library'})}</div>`:''}</div>
  ${!D.library.length?`<div class="mt">${empty('★','Your Personal Library is empty','Stretches you create are saved here for one-click reuse across sessions.')}</div>`:
  `<div class="grid3 mt">${items.map(l=>l.id===ed?`<div class="card">${sForm('lef',{submit:'libSave',label:'Save changes',cancel:'editCancel',extra:`data-id="${l.id}"`})}</div>`:
   `<div class="card hx" style="position:relative">${xBtn('libDel',`data-id="${l.id}" style="position:absolute;top:10px;right:10px"`)}
    ${l.img?`<img src="${esc(l.img)}" alt="${esc(l.name)}" style="width:100%;height:150px;object-fit:cover;border-radius:16px;margin-bottom:.7rem" onerror="this.remove()">`:''}
    <h3 style="word-break:break-word;padding-right:1.5rem">${esc(l.name)}</h3>
    <div class="row mt">${l.bodyPart?`<span class="tag">${esc(l.bodyPart)}</span>`:''}<span class="tag acc">${l.bilateral?(l.startSide==='R'?'Right → Left':'Left → Right'):'Single'}</span><span class="tag">${fmtTime(dur(l))}</span></div>
    ${l.desc?`<p class="small muted mt" style="white-space:pre-wrap">${esc(l.desc)}</p>`:''}
    <div class="row mt">${D.sessions.map(s=>{const has=dupIn(s.stretches,l.name);return`<button class="btn sm ${has?'':'acc'}" data-a="libToSess" data-id="${l.id}" data-s="${s.id}" ${has?'disabled':''}>${has?'✓ In '+esc(s.name):'+ Add to '+esc(s.name)}</button>`;}).join('')}
    <button class="btn sm ghost" data-a="libEdit" data-id="${l.id}">✏️ Edit</button></div></div>`).join('')}
   ${!items.length?`<p class="muted">No stretches match “${esc(q)}”.</p>`:''}</div>`}`;
}

/* ----- new session builder ----- */
function vBuilder(){
  const d=ui.draft;
  return`<div class="head"><button class="btn ghost" data-a="builderCancel">← Back</button><h2>New Session</h2></div>
  <div class="grid2"><div class="stack"><div class="card"><label class="f" for="dname" style="margin-top:0">Session name</label>
    <input class="in" id="dname" data-in="draftName" value="${esc(d.name)}" placeholder="Morning Mobility, Desk Reset, Before Bed…">
    <h3 class="mt2">Stretches (${d.stretches.length})</h3>
    <div class="mt" data-dropzone="dst">${d.stretches.length?d.stretches.map((st,i)=>`<div class="li hx" draggable="true" data-drag="dst" data-i="${i}"><span class="handle">⠿</span>${st.img?`<img class="thumb" src="${esc(st.img)}" alt="">`:''}<span class="lt"><b>${esc(st.name)}</b><br><span class="small muted">${fmtTime(dur(st))}${st.bilateral?' × 2':''}</span></span>
      <span class="arrows"><button data-a="dMove" data-i="${i}" data-d="-1" aria-label="Move up">↑</button><button data-a="dMove" data-i="${i}" data-d="1" aria-label="Move down">↓</button></span>${xBtn('dDel',`data-i="${i}"`)}</div>`).join(''):'<p class="small muted">Start from zero: create stretches or pick them from your library.</p>'}</div>
    <div class="row mt2"><button class="btn pri lg" data-a="builderSave">Create Session</button><button class="btn ghost" data-a="builderCancel">Cancel</button></div></div>
    ${D.library.length?`<div class="card"><h3>Pick from your Personal Library</h3>${libPicker('bl','draft')}</div>`:''}</div>
  <div class="card"><h3>Create a new stretch</h3>${sForm('bf',{lib:true,submit:'draftAdd'})}</div></div>`;
}
</script>
<script>
/* =================== PERSONAL PLANNER =================== */
const MEAL_TYPES=[['Breakfast','🍳'],['Lunch','🥪'],['Dinner','🍲'],['Snack','🍎']];
const mealIcon=t=>(MEAL_TYPES.find(m=>m[0]===t)||['','🍽️'])[1];
function weekLabel(mon){const sun=addDays(mon,6);return`${nice(mon,{month:'short',day:'numeric'})} – ${nice(sun,{month:'short',day:'numeric',year:'numeric'})}`;}
function stepper(id,label){return`<div><label class="f" for="${id}">${label}</label><div class="stepper"><button data-a="numStep" data-t="${id}" data-d="-1" aria-label="Decrease">−</button><input type="number" min="0" max="99" id="${id}" data-keep placeholder="0"><button data-a="numStep" data-t="${id}" data-d="1" aria-label="Increase">+</button></div></div>`;}

function vPlanner(){
  if(ui.page==='goalNew')return vGoalNew();
  if(ui.page==='mealNew')return vMealNew();
  if(ui.page&&ui.page.startsWith('meal:'))return vMealDetail(ui.page.slice(5));
  const isThis=ui.week===mondayOf(todayStr());
  const hd=`<div style="flex:1 1 auto"><button class="datehead" data-a="openCal" data-k="week" aria-label="Choose a week"><span>Week of ${weekLabel(ui.week)}</span><span class="cal-ico">📅</span></button>
    <div class="weeknav mt"><button class="btn sm" data-a="weekStep" data-d="-7" aria-label="Previous week">‹ Prev</button>${isThis?'<span class="tag">This week</span>':'<button class="btn sm" data-a="weekToday">This week</button>'}<button class="btn sm" data-a="weekStep" data-d="7" aria-label="Next week">Next ›</button></div></div>`;
  const tabs=[['goals','🎯 Goals'],['meals','🥗 Meal Prep'],['daily','📅 Daily Plan']];
  const sub=ui.sub.planner;
  return`<div class="head">${hd}<div class="subtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${sub===k?'on':''}" data-a="sub" data-s="${k}">${l}</button>`).join('')}</div></div>`+
    (sub==='goals'?vGoals():sub==='meals'?vMeals():vDaily());
}
function goalDone(g){const m=+g.msTarget||0,f=+g.freqTarget||0;if(!m&&!f)return false;return(!m||g.ms>=m)&&(!f||g.freq>=f);}
function vGoals(){
  const w=getWeek(ui.week);
  return`<div class="card"><h3>Objective for the whole week</h3><textarea class="in mt" id="wkobj" data-grow data-in="wkObj" placeholder="What would make this week feel like a win?">${esc(w.objective)}</textarea></div>
  <div class="row mt2 between"><h3>Weekly goals</h3><button class="btn pri" data-a="goalNew">+ Create Weekly Goal</button></div>
  <div class="grid2 mt">${w.goals.length?w.goals.map(g=>{const done=goalDone(g);const mt=+g.msTarget||0,ft=+g.freqTarget||0;
    return`<div class="card goal hx ${done?'complete':''}" style="position:relative">${xBtn('goalDel',`data-id="${g.id}" style="position:absolute;top:10px;right:10px"`)}
    <div class="row">${g.category?`<span class="tag">${esc(g.category)}</span>`:''}${isRec(g)?'<span class="tag acc">🔁 Every week</span>':''}${done?'<span class="won">✓ Goal reached</span>':''}</div>
    <h3 class="mt" style="word-break:break-word;padding-right:1.4rem">${esc(g.title)}</h3>${g.objective?`<p class="small muted mt" style="white-space:pre-wrap">${esc(g.objective)}</p>`:''}
    ${mt?`<div class="mt"><div class="row between"><span class="small"><b>Milestones</b></span><div class="stepper"><button data-a="goalStep" data-id="${g.id}" data-k="ms" data-d="-1" aria-label="Fewer">−</button><span class="val">${g.ms} / ${mt}</span><button data-a="goalStep" data-id="${g.id}" data-k="ms" data-d="1" aria-label="More">+</button></div></div><div class="prog mt"><i style="width:${clamp(g.ms/mt*100,0,100)}%"></i></div></div>`:''}
    ${ft?`<div class="mt"><div class="row between"><span class="small"><b>Times this week</b></span><div class="stepper"><button data-a="goalStep" data-id="${g.id}" data-k="freq" data-d="-1" aria-label="Fewer">−</button><span class="val">${g.freq} / ${ft}</span><button data-a="goalStep" data-id="${g.id}" data-k="freq" data-d="1" aria-label="More">+</button></div></div><div class="prog mt"><i style="width:${clamp(g.freq/ft*100,0,100)}%"></i></div></div>`:''}
    <div class="row mt"><button class="btn sm ghost" data-a="goalRepeat" data-id="${g.id}">${isRec(g)?'Stop repeating':'🔁 Repeat every week'}</button></div>
    </div>`;}).join(''):`<div style="grid-column:1/-1">${empty('🎯','No goals for this week yet','Set one thing you want to move forward, and track it step by step.')}</div>`}</div>`;
}
function vGoalNew(){
  const cats=[...new Set(Object.values(D.weeks).flatMap(w=>w.goals.map(g=>g.category)).filter(Boolean))];
  return`<div class="head"><button class="btn ghost" data-a="back">← Back</button><h2>Create Weekly Goal</h2></div>
  <div class="card" style="max-width:720px"><p class="muted small">For the week of ${weekLabel(ui.week)}</p>
  <label class="f" for="g-title">Goal title</label><input class="in" id="g-title" data-keep placeholder="Stretch every morning">
  <label class="f" for="g-obj">Objective for the whole week</label><textarea class="in" id="g-obj" data-keep data-grow placeholder="Why it matters and what done looks like"></textarea>
  <label class="f" for="g-cat">Category</label><input class="in" id="g-cat" data-keep list="g-cats" placeholder="Health, Work, Learning…"><datalist id="g-cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <div class="grid2">${stepper('g-ms','Milestones to reach')}${stepper('g-fq','Target times this week')}</div>
  <label class="check mt"><input type="checkbox" id="g-rep" data-keep> 🔁 Repeat this goal every week (progress resets each week)</label>
  <div class="row mt2"><button class="btn pri lg" data-a="goalSave">Create Goal</button><button class="btn ghost" data-a="back">Cancel</button></div></div>`;
}
function vMeals(){
  const w=getWeek(ui.week);
  let days='';for(let i=0;i<7;i++){const ms=w.meals.filter(m=>+m.day===i);if(!ms.length)continue;const d=addDays(ui.week,i);
    days+=`<div class="card day-card ${d===todayStr()?'today':''}"><h3>${DOW[i]}<span class="small muted">${nice(d,{month:'short',day:'numeric'})}</span></h3><div class="mt">${ms.sort((a,b)=>MEAL_TYPES.findIndex(t=>t[0]===a.type)-MEAL_TYPES.findIndex(t=>t[0]===b.type)).map(m=>`<div class="meal ${m.done?'done':''}" data-a="mealOpen" data-id="${m.id}" role="button" tabindex="0"><span class="mi">${mealIcon(m.type)}</span><span style="flex:1;min-width:0"><b style="word-break:break-word">${esc(m.name)}</b><br><span class="small muted">${esc(m.type||'Meal')}${m.ingredients.length?` · ${m.ingredients.length} ingredients`:''}</span></span>${m.done?'✓':'›'}</div>`).join('')}</div></div>`;}
  return`<div class="row"><button class="btn pri" data-a="mealNew">+ Create a Meal</button><button class="btn ${ui.open.grocery?'acc':''}" data-a="toggle" data-k="grocery">🛒 Grocery List${w.grocery.length?` (${w.grocery.filter(g=>!g.done).length})`:''}</button></div>
  ${ui.open.grocery?`<div class="card mt"><div class="row between"><h3>🛒 Grocery List</h3>${w.grocery.some(g=>g.done)?'<button class="btn sm ghost" data-a="grocClear">Clear checked</button>':''}</div>
    <div class="addline"><input class="in" id="groc-new" placeholder="Add an item" data-enter="grocAdd"><button class="btn pri" data-a="grocAdd">Add</button></div>
    <div class="mt">${w.grocery.map(g=>checkRow(g,'grocToggle','grocDel')).join('')||'<p class="small muted">Nothing on the list.</p>'}</div></div>`:''}
  ${days?`<div class="grid2 mt">${days}</div>`:`<div class="mt">${empty('🥗','No meals planned this week','Plan a meal and its recipe, ingredients and steps will live here.')}</div>`}`;
}
function checkRow(it,tog,del,extra=''){return`<div class="li hx ${it.done?'done':''}"><label class="check"><input type="checkbox" ${it.done?'checked':''} data-a="${tog}" data-id="${it.id}" ${extra}><span class="sr">Done</span></label><span class="lt">${esc(it.t)}</span>${xBtn(del,`data-id="${it.id}" ${extra}`)}</div>`;}
function vMealNew(){
  const d=ui.draftMeal;const f=ui.form.meal||(ui.form.meal={type:''});

    <label class="f">Meal</label><div class="seg">${MEAL_TYPES.map(([t,e])=>`<button class="${f.type===t?'on':''}" data-a="mealType" data-v="${t}">${e} ${t}</button>`).join('')}</div>

  <div class="card"><h3>Preparation steps</h3><div class="addline"><input class="in" id="ms-new" placeholder="Describe the next step" data-enter="dStepAdd"><button class="btn pri" data-a="dStepAdd">Add</button></div>

function findMeal(id){return getWeek(ui.week).meals.find(m=>m.id===id);}

  const safe=/^https?:\/\//i.test(m.link||'');

  <div class="row"><span class="tag">${DOW[m.day]}, ${nice(addDays(ui.week,+m.day),{month:'short',day:'numeric'})}</span>${m.type?`<span class="tag acc">${esc(m.type)}</span>`:''}${m.done?'<span class="won">✓ Made it</span>':''}</div>
  <div class="card mt"><h3>Recipe</h3>${safe?`<a class="btn acc mt" href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">Open recipe ↗</a>`:''}

/* =================== DAILY DIARY =================== */
function emojiPanel(k){
  const q=ui.search[k]||'';const sel=ui.emoji[k]||'';
  const list=EMOJI.filter(e=>similar(q,e.k)||e.e===q);
  return`<input class="in" id="${k}-q" data-in="search" data-k="${k}" value="${esc(q)}" placeholder="Search feelings and emojis (calm, proud, tired…)" autocomplete="off">
  <div class="emoji-grid mt" role="listbox" aria-label="Emoji">${list.map(e=>`<button class="${sel===e.e?'on':''}" data-a="emojiPick" data-k="${k}" data-v="${e.e}" title="${esc(e.k)}" aria-label="${esc(e.k)}">${e.e}</button>`).join('')||'<p class="small muted" style="grid-column:1/-1;padding:.5rem">No emoji match. You can still add it as text.</p>'}</div>
  <label class="f" for="${k}-name">Name</label><div class="addline" style="margin-top:0"><input class="in" id="${k}-name" data-keep data-enter="${k}Add" placeholder="${k==='fe'?'Feeling name':'Category name'}">${sel?`<span style="font-size:1.6rem">${sel}</span>`:''}<button class="btn pri" data-a="${k}Add">Add</button></div>`;
}
function vDiary(){
  const d=ui.diaryDate,today=todayStr();
  const hd=`<div style="flex:1 1 auto"><button class="datehead" data-a="openCal" data-k="diary" aria-label="Choose a date"><span>${nice(d,{weekday:'long',month:'long',day:'numeric'})}</span><span class="cal-ico">🗓️</span></button>
    <div class="weeknav mt"><button class="btn sm" data-a="dayStep" data-d="-1" aria-label="Previous day">‹</button>${d===today?'<span class="tag acc">Today</span>':'<button class="btn sm" data-a="dayToday">Today</button>'}<button class="btn sm" data-a="dayStep" data-d="1" aria-label="Next day">›</button><span class="small muted">${nice(d,{year:'numeric'})}</span></div></div>`;
  const tabs=[['entry','📓 Today’s Proud Entry'],['history','🗓️ Calendar & History']];
  return`<div class="head">${hd}<div class="subtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${ui.sub.diary===k?'on':''}" data-a="sub" data-s="${k}">${l}</button>`).join('')}</div></div>`+(ui.sub.diary==='entry'?vEntry():vHistory());
}
function vEntry(){
  const e=D.diary[ui.diaryDate]||{feelings:[],proud:'',cats:[],qa:[],wins:[]};if(!e.wins)e.wins=[];
  const fq=ui.search.fe||'';const feels=D.feelings.filter(f=>!ui.open.fe||similar(fq,f.name+' '+(EMOJI.find(x=>x.e===f.emoji)?.k||'')));
  const used=new Set(e.qa.map(q=>q.pid));
  return`<div class="card"><h3>Daily emotions & feelings</h3>
    <div class="chips mt">${feels.map(f=>`<button class="chip hx ${e.feelings.includes(f.id)?'on':''}" data-a="feelToggle" data-id="${f.id}" aria-pressed="${e.feelings.includes(f.id)}">${f.emoji?f.emoji+' ':''}${esc(f.name)}${xBtn('feelDel',`data-id="${f.id}"`).replace('<button','<span role="button" tabindex="0"').replace('</button>','</span>')}</button>`).join('')}
    <button class="chip add" data-a="toggle" data-k="fe">${ui.open.fe?'Close':'😊 + Add Feeling'}</button></div>
    ${ui.open.fe?`<div class="panel">${emojiPanel('fe')}</div>`:''}</div>
  <div class="card"><div class="row between"><h3>What I am proud of today</h3>${e.wins.length?`<span class="won">🏆 ${e.wins.length}</span>`:''}</div>
    <div class="mt">${e.wins.length?e.wins.map(w=>`<div class="li hx"><span class="lt">${esc(w.t)}</span>${xBtn('winDel',`data-id="${w.id}"`)}</div>`).join(''):'<p class="small muted">Nothing yet. Add anything you’re proud of, big or small.</p>'}</div>
    <div class="addline"><input class="in" id="win-new" data-keep placeholder="Add something you’re proud of" data-enter="winAdd"><button class="btn acc" data-a="winAdd">+ Add</button></div>
    <div class="chips mt">${D.categories.map(c=>`<button class="chip acc hx ${e.cats.includes(c.id)?'on':''}" data-a="catToggle" data-id="${c.id}" aria-pressed="${e.cats.includes(c.id)}">${c.emoji?c.emoji+' ':''}${esc(c.name)}${xBtn('catDel',`data-id="${c.id}"`).replace('<button','<span role="button" tabindex="0"').replace('</button>','</span>')}</button>`).join('')}
    <button class="chip add" data-a="toggle" data-k="ca">${ui.open.ca?'Close':'🏷️ + Add Category'}</button></div>
    ${ui.open.ca?`<div class="panel">${emojiPanel('ca')}</div>`:''}
</div>
  <div class="card"><h3>Reflection</h3><p class="small muted">Pick the questions you want today. Only those appear below.</p>
    <div class="chips mt">${D.prompts.map(p=>`<button class="chip hx ${used.has(p.id)?'on':''}" data-a="promptPick" data-id="${p.id}">${used.has(p.id)?'✓ ':'+ '}${esc(p.q)}${xBtn('promptDel',`data-id="${p.id}"`).replace('<button','<span role="button" tabindex="0"').replace('</button>','</span>')}</button>`).join('')}</div>
    <div class="addline"><input class="in" id="rq-new" data-keep placeholder="Write your own question" data-enter="promptAdd"><button class="btn pri" data-a="promptAdd">Add question</button></div>
    ${e.qa.length?`<div class="mt2">${e.qa.map(q=>`<div class="qa hx"><h4><span>${esc(q.q)}</span>${xBtn('qaDel',`data-id="${q.id}" title="Remove from today"`)}</h4><textarea class="in mt" id="qa-${q.id}" data-grow data-in="qaAns" data-id="${q.id}" placeholder="Your answer">${esc(q.a)}</textarea></div>`).join('')}</div>`:''}</div>`;
}
function vHistory(){
  const mo=ui.histMonth||ui.diaryDate.slice(0,7);
  const ents=Object.keys(D.diary).filter(k=>k.startsWith(mo)&&hasEntry(k)).sort().reverse();
  return`<div class="grid2"><div class="card cal">${calTop(mo,'histMove')}${calGrid(mo,{sel:ui.diaryDate,marks:hasEntry})}<div class="row mt"><button class="btn sm acc" data-a="histToday">Jump to Today</button></div></div>
  <div class="card"><h3>${nice(mo+'-01',{month:'long',year:'numeric'})}</h3>
  <div class="mt">${ents.length?ents.map(k=>{const e=D.diary[k];const em=e.feelings.map(id=>D.feelings.find(f=>f.id===id)).filter(Boolean).map(f=>f.emoji||f.name).join(' ');
    return`<div class="meal" data-a="histOpen" data-d="${k}" role="button" tabindex="0"><span class="mi">${(e.wins&&e.wins.length)?'🏆':'📓'}</span><span style="flex:1;min-width:0"><b>${nice(k,{weekday:'short',month:'short',day:'numeric'})}</b> <span>${esc(em)}</span><br><span class="small muted">${(e.wins&&e.wins.length)?esc(e.wins[0].t.slice(0,70))+(e.wins.length>1?' +'+(e.wins.length-1)+' more':''):(e.qa.length?e.qa.length+' reflections':'Feelings logged')}</span></span>›</div>`;}).join(''):empty('🗓️','No entries this month','Pick any day on the calendar to write or look back.')}</div></div></div>`;
}

/* =================== ACCOUNT =================== */
function pwField(id,label,ac){return`<label class="f" for="${id}">${label}</label><div class="pw"><input class="in" id="${id}" data-keep type="${ui.showPw[id]?'text':'password'}" autocomplete="${ac}"><button type="button" data-a="pwShow" data-id="${id}">${ui.showPw[id]?'Hide':'Show'}</button></div>`;}
function tzSelect(id,val,attr=''){return`<select class="in" id="${id}" ${attr}>${TZS.map(z=>`<option ${z===val?'selected':''}>${z}</option>`).join('')}</select>`;}
function vAccount(){
  const msg=ui.msg?`<p class="${ui.msg.ok?'ok':'err'}" role="alert">${esc(ui.msg.text)}</p>`:'';
  if(ui.recovery)return`<div class="auth"><div class="card"><h2>Choose a new password</h2>
    ${pwField('r-new','New password','new-password')}${pwField('r-new2','Confirm new password','new-password')}
    ${msg}<button class="btn pri lg mt2" data-a="setNewPw">Save new password</button></div></div>`;
  if(!acct){const t=ui.authTab;
    return`<div class="auth"><div class="card"><h2>${t==='login'?'Welcome back':t==='signup'?'Create your account':'Reset your password'}</h2>
    <p class="muted small mt">${t==='forgot'?'We’ll email you a link to choose a new password.':'Your stretches, plans and diary follow you to every device.'}</p>
    <div class="subtabs mt" style="display:flex">${[['login','Login'],['signup','Sign Up'],['forgot','Forgot Password']].map(([k,l])=>`<button class="${t===k?'on':''}" style="flex:1" data-a="authTab" data-t="${k}">${l}</button>`).join('')}</div>
    ${t==='signup'?`<label class="f" for="a-name">Name</label><input class="in" id="a-name" data-keep autocomplete="name">`:''}
    <label class="f" for="a-email">Email</label><input class="in" id="a-email" data-keep type="email" autocomplete="email" inputmode="email">
    ${t==='forgot'?'':pwField('a-pw','Password',t==='signup'?'new-password':'current-password')}
    ${t==='signup'?`<label class="f" for="a-tz">Time zone</label>${tzSelect('a-tz',ui.tz,'data-keep')}`:''}
    ${t!=='forgot'?`<label class="check mt"><input type="checkbox" id="a-rem" data-keep checked> Remember me</label>`:''}
    ${msg}<button class="btn pri lg mt2" style="width:100%;justify-content:center" data-a="auth" ${ui.busy?'disabled':''}>${ui.busy?'One moment…':t==='login'?'Log In':t==='signup'?'Sign Up':'Email me a reset link'}</button></div></div>`;}
  return`<div class="head"><h2>Your account</h2></div><div class="grid2">
  <div class="card"><div class="row"><div class="brand-mark" style="width:56px;height:56px;font-size:1.4rem;animation:none"><span style="animation:none">${esc((acct.name||'?').trim()[0]||'?').toUpperCase()}</span></div><div><h3>${esc(acct.name)}</h3><p class="small muted">${esc(acct.email)}</p></div></div>
    <label class="f" for="p-name">Display name</label><div class="addline" style="margin-top:0"><input class="in" id="p-name" value="${esc(acct.name)}" data-enter="nameSave"><button class="btn" data-a="nameSave">Save</button></div>
    <label class="f">Email address</label><p>${esc(acct.email)}</p>
    <label class="f" for="p-tz">Time zone</label>${tzSelect('p-tz',acct.tz,'data-ch="acctTz"')}
    <p class="small muted mt" id="syncnote">${lastSync?'Saved to cloud at '+lastSync:'Your progress saves automatically.'}</p>
    <button class="btn danger mt2" data-a="signOut">Sign Out</button></div>
  <div class="card"><h3>Change password</h3>${pwField('c-cur','Current password','current-password')}${pwField('c-new','New password','new-password')}${pwField('c-new2','Confirm new password','new-password')}
    ${msg}<button class="btn pri mt2" data-a="changePw" ${ui.busy?'disabled':''}>Change Password</button></div></div>`;
}

/* =================== THEME STUDIO =================== */
function themeModal(){
  const t=currentTheme();const sw=(p,custom)=>`<button class="sw ${t.preset===p.id?'on':''} ${custom?'hx':''}" style="position:relative" data-a="themePick" data-id="${p.id}" data-c="${custom?1:0}"><span class="dots"><i style="background:${p.b}"></i><i style="background:${p.p}"></i><i style="background:${p.a}"></i></span><b>${esc(p.name)}</b>${custom?xBtn('themeDel',`data-id="${p.id}" style="position:absolute;top:-8px;right:-8px"`).replace('<button','<span role="button" tabindex="0"').replace('</button>','</span>'):''}</button>`;
  return`<div class="scrim" data-a="closeModal" data-self="1"><div class="modal wide" role="dialog" aria-label="Theme and colors">
  <div class="row between"><h3>🎨 Theme & Color Studio</h3><button class="btn sm ghost" data-a="closeModal">Close</button></div>
  <p class="small muted mt">The whole site recolors, and text contrast adjusts automatically.</p>
  <h4 class="mt2">Palettes</h4><div class="swatches mt">${PRESETS.map(p=>sw(p)).join('')}</div>
  ${D.customThemes.length?`<h4 class="mt2">Your presets</h4><div class="swatches mt">${D.customThemes.map(p=>sw(p,true)).join('')}</div>`:''}
  <h4 class="mt2">Custom colors</h4><div class="colorrow mt"><label>Primary<input type="color" id="tc-p" value="${t.p}" data-in="themeColor"></label><label>Accent<input type="color" id="tc-a" value="${t.a}" data-in="themeColor"></label><label>Background<input type="color" id="tc-b" value="${t.b}" data-in="themeColor"></label></div>
  <div class="addline"><input class="in" id="tc-name" placeholder="Name this theme" data-enter="themeSave"><button class="btn pri" data-a="themeSave">Save preset</button></div>
  <div class="row mt"><button class="btn sm ghost" data-a="themeReset">Reset to default</button>${!acct?'<span class="small muted">Sign in to keep your theme across devices.</span>':''}</div></div></div>`;
}
</script>
<script>
/* =================== ACTIONS =================== */
ui.pages={};
Object.defineProperty(ui,'page',{get(){return ui.pages[ui.tab]||null;},set(v){ui.pages[ui.tab]=v;},configurable:true});
const val=id=>{const el=document.getElementById(id);return el?el.value:'';};
const top0=()=>window.scrollTo({top:0,behavior:'smooth'});
const addMonths=(mo,n)=>{let[y,m]=mo.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return`${y}-${String(m).padStart(2,'0')}`;};
const curMeal=()=>ui.page&&ui.page.startsWith('meal:')?findMeal(ui.page.slice(5)):null;
const entry=()=>getEntry(ui.diaryDate);
function cloudProfile(patch){if(acct)sb.auth.updateUser({data:patch}).then(({error})=>{if(error)toast('Saved here. The cloud will update when you’re back online.');});}
function resetUi(){Object.assign(ui,{sub:{stretch:'timer',planner:'goals',diary:'entry'},open:{},draft:null,draftMeal:null,editing:null,img:{},showPw:{},emoji:{},search:{},cal:null,themeOpen:false,histMonth:null,msg:null,vals:{},form:{},pages:{}});
  ui.week=mondayOf(todayStr());ui.diaryDate=todayStr();T.sid=null;tReset();}

const A={
  async setNewPw(){
    const n1=val('r-new'),n2=val('r-new2');
    if(n1.length<6)return fail('Passwords need at least 6 characters.');
    if(n1!==n2)return fail('The two passwords don’t match.');
    const{error}=await sb.auth.updateUser({password:n1});
    if(error)return fail(error.message);
    await sb.auth.signOut();ui.recovery=false;ui.authTab='login';
    ui.msg={ok:true,text:'Password updated. Log in with it.'};render();
  },
  tab(el){ui.tab=el.dataset.t;ui.msg=null;render();top0();},
  sub(el){ui.sub[ui.tab]=el.dataset.s;ui.editing=null;render();},
  toggle(el){const k=el.dataset.k;ui.open[k]=!ui.open[k];render();},
  viewToggle(){ui.force=isMobile()?'d':'m';render();toast(isMobile()?'Mobile layout':'Desktop layout');},
  themeOpen(){ui.themeOpen=true;renderModal();},
  closeModal(el,e){if(el.dataset.self&&e.target!==el)return;ui.cal=null;ui.themeOpen=false;renderModal();},
  openCal(el){openCal(el.dataset.k);},
  calMove(el){ui.cal.month=addMonths(ui.cal.month,+el.dataset.step);renderModal();},
  calToday(){const t=todayStr();if(ui.cal.kind==='week')ui.week=mondayOf(t);else ui.diaryDate=t;ui.cal=null;renderModal();render();},
  calPick(el){const d=el.dataset.d;
    if(ui.cal){if(ui.cal.kind==='week'){ui.week=mondayOf(d);ui.pages.planner=null;}else{ui.diaryDate=d;ui.histMonth=null;}ui.cal=null;renderModal();render();}
    else{ui.diaryDate=d;ui.sub.diary='entry';render();top0();}},
  histMove(el){ui.histMonth=addMonths(ui.histMonth||ui.diaryDate.slice(0,7),+el.dataset.step);render();},
  histToday(){ui.histMonth=null;ui.diaryDate=todayStr();render();},
  histOpen(el){ui.diaryDate=el.dataset.d;ui.sub.diary='entry';render();top0();},

  /* sessions */
  pickSess(el){D.activeSession=el.dataset.id;ui.open.rename=false;ui.editing=null;commit();render();},
  newSession(){ui.tab='stretch';ui.draft={name:'',stretches:[]};ui.page='builder';ui.open.rename=false;resetForm('bf');render();top0();},
  renameSess(){const n=val('ren').trim();if(!n)return toast('Session name can’t be empty.');session().name=n;ui.open.rename=false;commit();render();toast('Session renamed');},
  moveSess(el){const i=D.sessions.findIndex(s=>s.id===D.activeSession),j=i+ +el.dataset.d;if(j<0||j>=D.sessions.length)return;[D.sessions[i],D.sessions[j]]=[D.sessions[j],D.sessions[i]];commit();render();},
  delSession(){const s=session();if(!s||!confirm(`Delete “${s.name}”? Stretches in your Personal Library stay.`))return;D.sessions=D.sessions.filter(x=>x.id!==s.id);D.activeSession=D.sessions[0]?.id||null;T.sid=null;ui.open.rename=false;commit();render();toast('Session deleted');},
  builderCancel(){ui.page=null;render();},

/* =================== AUTH =================== */
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function fail(t){ui.msg={text:t};ui.busy=false;render();}
async function doAuth(){
  const t=ui.authTab,email=val('a-email').trim(),pw=val('a-pw');
  if(!emailOk(email))return fail('Enter a valid email address.');
  if(t!=='forgot'&&pw.length<6)return fail('Passwords need at least 6 characters.');
  const remember=!!$('#a-rem')?.checked;
  ui.busy=true;ui.msg=null;render();
  try{
    if(t==='signup'){
      const name=val('a-name').trim();if(!name)return fail('Enter your name.');
      const tzv=val('a-tz')||DEFAULT_TZ;
      const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name,tz:tzv}}});
      if(error)return fail(error.message);
      if(!data.session){ui.authTab='login';ui.busy=false;ui.msg={ok:true,text:'Check your email to confirm, then log in.'};return render();}
      acct={key:data.user.id,name,email:data.user.email,tz:tzv,remember};sessSet(acct);
      D=blankData();resetUi();ui.tab='account';applyTheme(defaultTheme());commit({now:true});
      ui.busy=false;render();toast(`Welcome to FlowSpace, ${name}`);
    }else if(t==='login'){
      const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error)return fail(/invalid login/i.test(error.message)?'Email or password is incorrect.':error.message);
      const m=data.user.user_metadata||{};
      acct={key:data.user.id,name:m.name||email.split('@')[0],email:data.user.email,tz:m.tz||DEFAULT_TZ,remember};sessSet(acct);
      const tab=ui.tab;D=await pullData(acct.key);resetUi();ui.tab=tab;applyTheme();ui.busy=false;render();toast(`Welcome back, ${acct.name}`);
    }else{
      const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error)return fail(error.message);
      ui.msg={ok:true,text:'If that email has an account, a reset link is on its way.'};ui.busy=false;render();
    }
  }catch(e){fail('Can’t reach the cloud right now. Check your connection and try again.');}
}
async function doChangePw(){
  const cur=val('c-cur'),n1=val('c-new'),n2=val('c-new2');
  if(n1.length<6)return fail('New password needs at least 6 characters.');
  if(n1!==n2)return fail('The new passwords don’t match.');
  ui.busy=true;ui.msg=null;render();
  try{
    const chk=await sb.auth.signInWithPassword({email:acct.email,password:cur});
    if(chk.error)return fail('Your current password is incorrect.');
    const{error}=await sb.auth.updateUser({password:n1});
    if(error)return fail(error.message);
    clearVals('c-');ui.msg={ok:true,text:'Password changed.'};ui.busy=false;render();
  }catch(e){fail('Can’t reach the cloud right now. Try again in a moment.');}
}

/* =================== EVENTS =================== */
let suppressClick=false,pressT=0;
document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return;}
  if(!e.target.closest('.ac-wrap'))$$('.ac').forEach(b=>b.hidden=true);
  if(!e.target.closest('.hx.tapx'))$$('.tapx').forEach(x=>x.classList.remove('tapx'));
  const t=e.target.closest('[data-a]');if(!t||!A[t.dataset.a])return;
  if(t.tagName==='A')return;
  if(t.dataset.a!=='closeModal'||!t.dataset.self)e.preventDefault();
  if(t.type==='checkbox')e.preventDefault();
  snapshot();A[t.dataset.a](t,e);
},true);
const keepSync=e=>{const el=e.target;if(el&&el.matches&&el.matches('[data-keep]')&&el.id)ui.vals[el.id]=el.type==='checkbox'?el.checked:el.value;};
document.addEventListener('input',keepSync);
document.addEventListener('change',e=>{const el=e.target;if(el&&(el.tagName==='SELECT'||el.type==='checkbox'))keepSync(e);});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.ac&&!el.dataset.in)showAc(el);if(el.dataset.in&&IN[el.dataset.in]){if(el.dataset.in==='search')snapshot();IN[el.dataset.in](el,e);}});
document.addEventListener('focusin',e=>{const el=e.target;if(el.dataset&&el.dataset.ac&&el.value)showAc(el);});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.ch&&CH[el.dataset.ch]){snapshot();CH[el.dataset.ch](el,e);}
  if(el.dataset.file&&el.files&&el.files[0]){snapshot();try{ui.img[el.dataset.file]=await readImage(el.files[0]);render();}catch(err){toast('That picture couldn’t be read. Try a JPG or PNG.');}}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(ui.cal||ui.themeOpen){ui.cal=null;ui.themeOpen=false;renderModal();}$$('.ac').forEach(b=>b.hidden=true);}
  const el=e.target;if(e.key==='Enter'&&el.dataset&&el.dataset.enter&&A[el.dataset.enter]){e.preventDefault();snapshot();A[el.dataset.enter](el,e);}
  if((e.key==='Enter'||e.key===' ')&&el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.a){e.preventDefault();el.click();}
});
/* long-press reveals delete buttons on touch screens */
document.addEventListener('pointerdown',e=>{unlockAudio();if(e.pointerType!=='touch')return;const h=e.target.closest('.hx');if(!h||e.target.closest('.x'))return;
  clearTimeout(pressT);pressT=setTimeout(()=>{$$('.tapx').forEach(x=>x.classList.remove('tapx'));h.classList.add('tapx');suppressClick=true;setTimeout(()=>suppressClick=false,800);if(navigator.vibrate)navigator.vibrate(12);},450);},{passive:true});
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='pointermove'&&Math.abs(e.movementX)+Math.abs(e.movementY)<6)return;clearTimeout(pressT);},{passive:true}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.hx')&&matchMedia('(hover:none)').matches)e.preventDefault();});
/* drag and drop reordering */
let drag=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;drag={type:el.dataset.drag,i:el.dataset.i,id:el.dataset.id};el.classList.add('drag');try{e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move';}catch(_){}});
document.addEventListener('dragend',()=>{$$('.drag,.dragover').forEach(x=>x.classList.remove('drag','dragover'));drag=null;});
document.addEventListener('dragover',e=>{if(!drag)return;const el=e.target.closest('[data-drag]');if(el&&el.dataset.drag===drag.type){e.preventDefault();$$('.dragover').forEach(x=>x!==el&&x.classList.remove('dragover'));el.classList.add('dragover');}});
document.addEventListener('drop',e=>{if(!drag)return;const el=e.target.closest('[data-drag]');if(!el||el.dataset.drag!==drag.type)return;e.preventDefault();
  const mv=(a,i,j)=>{if(i===j||i<0||j<0)return;const[x]=a.splice(i,1);a.splice(j,0,x);};
  if(drag.type==='sess'){mv(D.sessions,D.sessions.findIndex(s=>s.id===drag.id),D.sessions.findIndex(s=>s.id===el.dataset.id));commit();}
  else if(drag.type==='st'){const s=session(),i=+drag.i,j=+el.dataset.i;const cur=s.stretches[T.idx];mv(s.stretches,i,j);T.idx=Math.max(0,s.stretches.indexOf(cur));commit();}
  else if(drag.type==='dst'){mv(ui.draft.stretches,+drag.i,+el.dataset.i);}
  drag=null;render();});

function readImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,720/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

let lastMobile=null;
addEventListener('resize',()=>{clearTimeout(addEventListener._r);addEventListener._r=setTimeout(()=>{if(!ui.force&&isMobile()!==lastMobile){lastMobile=isMobile();snapshot();render();}},150);});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!D.theme)applyTheme();});
setInterval(()=>{const t=todayStr();if(t!==ui._today){const was=ui._today;ui._today=t;if(was&&ui.diaryDate===was){ui.diaryDate=t;}if(was&&ui.week===mondayOf(was))ui.week=mondayOf(t);if(was&&!document.activeElement?.matches('input,textarea'))render();}},60000);

/* =================== INIT =================== */
(async function init(){
  ui.week=mondayOf(todayStr());ui.diaryDate=todayStr();ui._today=todayStr();lastMobile=isMobile();
  applyTheme();
  const{data:{session}}=await sb.auth.getSession();
  const s=sessGet();
  if(session&&s&&s.key===session.user.id){
    acct=s;const c=await store.get('data:'+s.key);if(c){D=migrate(c);}
    ui.week=mondayOf(todayStr());ui.diaryDate=todayStr();applyTheme();render();
    try{D=await pullData(s.key);T.sid=null;applyTheme();if(!document.activeElement?.matches('input,textarea'))render();}catch(e){}
  }else render();
})();
</script>
